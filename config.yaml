# EvoConnect4 configuration — tunable defaults from plan §10.
population_size: 500

board_columns: 7
board_rows: 6

hidden_layer_sizes: [24]
weight_init_std: 0.5

lifespan_range: [50, 150]
lifespan_mutation_scale: 0.10

mutation_rate_range: [0.01, 0.5]
mutation_rate_tau: 0.15

crossover_rate_range: [0.0, 1.0]
crossover_rate_mutation_std: 0.05

tournament_size: 5

reproduction_interval_min: 6
reproduction_interval_max: 30

games_per_pair_per_tick: 2

cull_fraction_range: [0.40, 0.60]
cull_fraction_beta_a: 1.0
cull_fraction_beta_b: 1.0
cull_allow_immature_offspring: true

benchmark_every_n_ticks: 10
benchmark_games_per_opponent: 20

heuristic_games_per_agent_per_tick: 2
heuristic_survival_alpha: 0.5
heuristic_bot_level: "tactical"
heuristic_fitness_weight_max: 0.7
heuristic_fitness_weight_min: 0.3
heuristic_weight_adapt_low: 0.60
heuristic_weight_adapt_high: 0.90
heuristic_weight_adapt_window: 20

hof_enabled: true
hof_max_size: 20
hof_games_per_agent_per_tick: 2
hof_maintenance_every_n_ticks: 50
hof_maintenance_heuristic_games: 20
hof_maintenance_peer_games: 4
hof_entry_heuristic_threshold: 0.70
hof_eviction_margin: 0.15
hof_fitness_weight_max: 0.4

random_seed: 42
